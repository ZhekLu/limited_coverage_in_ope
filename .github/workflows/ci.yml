name: Scientific validation

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - run: make setup
      - run: make check
      - run: make smoke
      - run: make build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: results/smoke
          if-no-files-found: ignore
